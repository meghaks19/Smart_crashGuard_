[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-crashguard"
version = "0.1.0"
description = "YOLO-based dashcam incident capture and emergency notification prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0", "opencv-python>=4.10.0", "numpy>=1.26.0",
  "PyYAML>=6.0.2", "python-dotenv>=1.0.1", "pyserial>=3.5",
  "twilio>=9.3.0", "faiss-cpu>=1.8.0", "sentence-transformers>=3.0.1",
  "openai>=1.0.0", "streamlit>=1.38.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

